services:

  app:
    build: .
    container_name: gamehub-app
    restart: always
    ports:
      - "8000:8000"
    networks:
      - gamehub-net

  notification-consumer:
    build: .
    container_name: gamehub-notification-consumer
    restart: always
    command: python -m app.consumer
    networks:
      - gamehub-net

  redis-master:
    image: redis:7
    container_name: gamehub-redis-master
    restart: always
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    networks:
      - gamehub-net
    volumes:
      - ./redis_conf/redis/master:/usr/local/etc/redis
      - redis-master-data:/data

  redis-replica-1:
    image: redis:7
    container_name: gamehub-redis-replica-1
    restart: always
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6380:6379"
    networks:
      - gamehub-net
    volumes:
      - ./redis_conf/redis/replica-1:/usr/local/etc/redis
      - redis-replica-1-data:/data

  redis-replica-2:
    image: redis:7
    container_name: gamehub-redis-replica-2
    restart: always
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6381:6379"
    networks:
      - gamehub-net
    volumes:
      - ./redis_conf/redis/replica-2:/usr/local/etc/redis
      - redis-replica-2-data:/data

  redis-sentinel-1:
    image: redis:7
    container_name: gamehub-redis-sentinel-1
    restart: always
    command: redis-sentinel /etc/redis/sentinel1.conf
    ports:
      - "26379:26379"
    networks:
      - gamehub-net
    volumes:
      - ./redis_conf/sentinel/sentinel1:/etc/redis

  redis-sentinel-2:
    image: redis:7
    container_name: gamehub-redis-sentinel-2
    restart: always
    command: redis-sentinel /etc/redis/sentinel2.conf
    ports:
      - "26380:26379"
    networks:
      - gamehub-net
    volumes:
      - ./redis_conf/sentinel/sentinel2:/etc/redis

  redis-sentinel-3:
    image: redis:7
    container_name: gamehub-redis-sentinel-3
    restart: always
    command: redis-sentinel /etc/redis/sentinel3.conf
    ports:
      - "26381:26379"
    networks:
      - gamehub-net
    volumes:
      - ./redis_conf/sentinel/sentinel3:/etc/redis

networks:
  gamehub-net:

volumes:
  redis-master-data:
  redis-replica-1-data:
  redis-replica-2-data:
